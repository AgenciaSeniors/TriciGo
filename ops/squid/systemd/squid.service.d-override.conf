# TriciGo — keep squid alive across crashes (Track 1b / 4a auto-recovery).
# Install as a drop-in: /etc/systemd/system/squid.service.d/override.conf
#   mkdir -p /etc/systemd/system/squid.service.d
#   cp squid.service.d-override.conf /etc/systemd/system/squid.service.d/override.conf
#   systemctl daemon-reload && systemctl restart squid
# See ops/squid/README.md.
[Service]
Restart=always
RestartSec=5s
StartLimitIntervalSec=0
