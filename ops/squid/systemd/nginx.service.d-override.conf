# TriciGo — keep nginx alive across crashes (Track 1b / 4a auto-recovery).
# Install as a drop-in: /etc/systemd/system/nginx.service.d/override.conf
#   mkdir -p /etc/systemd/system/nginx.service.d
#   cp nginx.service.d-override.conf /etc/systemd/system/nginx.service.d/override.conf
#   systemctl daemon-reload
# nginx also fronts the web/admin apps + the /np-proxy/ reverse proxy, so
# keeping it up is doubly important. See ops/squid/README.md.
[Service]
Restart=always
RestartSec=5s
StartLimitIntervalSec=0
