# TriciGo — fail2ban jail for the squid payment proxy (Track 3c).
# Install to /etc/fail2ban/jail.d/tricigo-squid-auth.conf
# Reload: fail2ban-client reload ; status: fail2ban-client status tricigo-squid-auth
#
# Bans an IP that racks up repeated auth-denied CONNECTs (token brute force /
# unauthenticated hammering). Thresholds are lenient enough that a legit
# checkout retry (a couple of 407s while the WebView answers the challenge)
# never trips it.
[tricigo-squid-auth]
enabled  = true
port     = 13128
protocol = tcp
filter   = tricigo-squid-auth
logpath  = /var/log/squid/access.log
maxretry = 20
findtime = 300
bantime  = 3600
