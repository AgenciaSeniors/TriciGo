# TriciGo — fail2ban filter for squid proxy-auth abuse (Track 3c).
# Install to /etc/fail2ban/filter.d/tricigo-squid-auth.conf
#
# Matches squid's native access.log denied/auth-failure lines. The client IP is
# the 3rd field in the default squid log format:
#   <epoch.ms> <elapsed> <client_ip> TCP_DENIED/407 ... CONNECT host:443 ...
# We ban IPs racking up 407 (auth required/failed) or 403 (denied) — i.e. token
# brute-force or unauthenticated hammering of the CONNECT proxy.
[Definition]
failregex = ^\s*\d+\.\d+\s+\d+\s+<HOST>\s+TCP_DENIED/40[37]\b
ignoreregex =
