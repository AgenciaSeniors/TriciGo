# ============================================================
# TriciGo — canonical squid.conf for the NETOPIA in-app payment proxy
#
# This is the VERSIONED source of truth for /etc/squid/squid.conf on the VPS
# (187.77.214.236). The in-app checkout WebView (NetopiaCheckout) tunnels the
# NETOPIA hosted card page + 3-D Secure through this CONNECT proxy so NETOPIA's
# edge sees the clean VPS IP instead of a reputation-flagged user IP (Cuban
# ETECSA otherwise gets a Google Cloud Armor 403). TLS passthrough, NO SSL-bump
# → the VPS never sees the card → PCI SAQ-A. **NEVER add ssl_bump.**
#
# Apply: see ops/squid/README.md. Always `squid -k parse` + back up the live
# conf before `systemctl restart squid` (a reconfigure does NOT swap the auth
# helper — restart is required when auth_param changes).
# ============================================================

http_port 13128

# ── Auth (so it isn't an open proxy) ──
# hmac_auth.sh accepts EITHER the static htpasswd cred (curl/dev smoke only) OR
# an ephemeral HMAC token minted by the mint-netopia-proxy-credential EF.
auth_param basic program /etc/squid/hmac_auth.sh
auth_param basic children 5
auth_param basic realm tricigo
auth_param basic credentialsttl 2 minutes
acl authed proxy_auth REQUIRED

# ── CONNECT restricted to :443 (HTTPS only) ──
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# ── Hardening (Track 3 — abuse limits that DON'T break 3-D Secure) ──
# A single legitimate checkout opens several parallel connections (the hosted
# page assets + the unpredictable bank ACS domains). 25 concurrent per client
# IP is comfortably above that but caps a client trying to fan the VPS out as a
# general-purpose proxy. maxconn matches when the count EXCEEDS the number.
acl conn_flood maxconn 25
http_access deny CONNECT conn_flood

# Tunnels are short-lived checkouts: cap how long one can stay open and how long
# we wait to reach the origin, so an abandoned/abused tunnel can't linger.
connect_timeout 30 seconds
client_lifetime 1 hour
half_closed_clients off

# Header hygiene (belt-and-suspenders — CONNECT tunnels are opaque, so squid
# can't inject headers into the encrypted stream anyway; the user IP is never
# forwarded to NETOPIA inside the tunnel).
via off
forwarded_for delete
httpd_suppress_version_string on

# ── The one allow rule: authed CONNECT to :443 ──
http_access allow CONNECT SSL_ports authed
http_access deny all

# Never cache (single-use checkout pages).
cache deny all

# ── OPTIONAL per-client bandwidth cap (defense-in-depth, OFF by default) ──
# Uncomment to throttle per-IP tunnel throughput. Left OFF because a mis-tuned
# cap can throttle a real 3-D Secure page on a slow link (worse UX than the
# abuse it prevents), and the abuse vector already needs a valid logged-in
# account (10 mints/min, 10-min TTL). If you enable it, keep `individual`
# GENEROUS (>= 5 MB/s) so a real checkout is never affected. Values are
# bytes/sec as `restore/max`; -1/-1 = unlimited.
#delay_pools 1
#delay_class 1 2
#delay_parameters 1 -1/-1 5242880/5242880
#delay_access 1 allow authed
#delay_access 1 deny all
