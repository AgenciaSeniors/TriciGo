plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.webviewproxy'
version = '0.1.0'

android {
  namespace "expo.modules.webviewproxy"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ProxyController / ProxyConfig / WebViewFeature live in androidx.webkit.
  implementation "androidx.webkit:webkit:1.12.1"
}
