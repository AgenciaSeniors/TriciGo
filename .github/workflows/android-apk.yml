name: Android APK (debug-signed)

# Triggered by tags like `driver-v1.0.0-apk` or `client-v1.0.0-apk`.
# Produces an APK downloadable as a workflow artifact.
# NOTE: Debug-signed — good for sideload testing on real Android devices,
# NOT submittable to Play Store. For production submission use EAS.

on:
  push:
    tags:
      - 'client-v*-apk'
      - 'driver-v*-apk'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        type: choice
        options: [driver, client]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Determine target app
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=${{ github.event.inputs.app }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/driver-v*-apk ]]; then
            echo "app=driver" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/client-v*-apk ]]; then
            echo "app=client" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown trigger" >&2 ; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (native android project)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://lqaufszburqvlslpcuac.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hSzDS_2ivar8CGqUm-yd3w_-65h1Zsc
          EXPO_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoidHJpY2lnbyIsImEiOiJjbW1wbmlnemIwczI4MnNvcmdremJwaTRzIn0._lAOaQ1Eg9LfszmlcZ5GQg
          EXPO_PUBLIC_SENTRY_DSN: https://c2c4fdaaa1b31143a8c7d20798005334@o4511046478659584.ingest.us.sentry.io/4511046494519296
          EXPO_PUBLIC_POSTHOG_API_KEY: phc_bgHqti7yz10ZStiwKwPeoYprkQeT7bu00QDV1hVvmv9
        run: |
          cd apps/${{ steps.target.outputs.app }}
          pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://lqaufszburqvlslpcuac.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hSzDS_2ivar8CGqUm-yd3w_-65h1Zsc
          EXPO_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoidHJpY2lnbyIsImEiOiJjbW1wbmlnemIwczI4MnNvcmdremJwaTRzIn0._lAOaQ1Eg9LfszmlcZ5GQg
          EXPO_PUBLIC_SENTRY_DSN: https://c2c4fdaaa1b31143a8c7d20798005334@o4511046478659584.ingest.us.sentry.io/4511046494519296
          EXPO_PUBLIC_POSTHOG_API_KEY: phc_bgHqti7yz10ZStiwKwPeoYprkQeT7bu00QDV1hVvmv9
          SENTRY_ORG: agencia-senores
          SENTRY_PROJECT: tricigo-mobile
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          cd apps/${{ steps.target.outputs.app }}/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cd apps/${{ steps.target.outputs.app }}/android/app/build/outputs/apk/debug
          ls -la
          mv app-debug.apk tricigo-${{ steps.target.outputs.app }}-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tricigo-${{ steps.target.outputs.app }}-apk
          path: apps/${{ steps.target.outputs.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          echo "### ✅ APK built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- App: **${{ steps.target.outputs.app }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Download: [Actions → this run → Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install on Android:** enable \"Install from unknown sources\", then open the APK file." >> $GITHUB_STEP_SUMMARY
