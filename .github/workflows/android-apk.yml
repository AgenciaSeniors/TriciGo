name: Android APK (standalone debug-keystore)

# Triggered by tags like `driver-v1.0.0-apk` or `client-v1.0.0-apk`.
# Produces a RELEASE-variant APK signed with a debug-style keystore
# generated on the fly. The APK bundles JS natively — it runs
# standalone on any Android device without needing Metro.
# NOT submittable to Play Store (debug keystore, not a real release
# cert). For Play Store use EAS production builds.

on:
  push:
    tags:
      - 'client-v*-apk'
      - 'driver-v*-apk'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        type: choice
        options: [driver, client]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Determine target app + demo flag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=${{ github.event.inputs.app }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/driver-v*-apk ]]; then
            echo "app=driver" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/client-v*-apk ]]; then
            echo "app=client" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown trigger" >&2 ; exit 1
          fi
          # Tag suffix "-demo-apk" (e.g. client-v1.1.7-demo-apk) turns
          # on EXPO_PUBLIC_DEMO_MODE for this build. See docs/DEMO_MODE.md.
          if [[ "${{ github.ref }}" == *"-demo-apk" ]]; then
            echo "demo=true" >> "$GITHUB_OUTPUT"
            echo "demo_city=sao_paulo" >> "$GITHUB_OUTPUT"
            echo "✓ Demo mode ON (city=sao_paulo)"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
            echo "demo_city=havana" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write google-services.json (from GH secret, else placeholder)
        env:
          DRIVER_GS: ${{ secrets.DRIVER_GOOGLE_SERVICES_JSON }}
          CLIENT_GS: ${{ secrets.CLIENT_GOOGLE_SERVICES_JSON }}
        run: |
          APP="${{ steps.target.outputs.app }}"
          SECRET=""
          if [ "$APP" = "driver" ] && [ -n "$DRIVER_GS" ]; then
            echo "$DRIVER_GS" > "apps/$APP/google-services.json"
            echo "✓ Wrote real google-services.json from DRIVER_GOOGLE_SERVICES_JSON secret"
          elif [ "$APP" = "client" ] && [ -n "$CLIENT_GS" ]; then
            echo "$CLIENT_GS" > "apps/$APP/google-services.json"
            echo "✓ Wrote real google-services.json from CLIENT_GOOGLE_SERVICES_JSON secret"
          else
            # Placeholder so prebuild doesn't fail — the file must exist
            # because app.json references it, but without real FCM
            # credentials push notifications won't reach the device.
            cat > "apps/$APP/google-services.json" <<'PLACEHOLDER'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "tricigo-placeholder",
              "storage_bucket": "tricigo-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "app.tricigo.__APP__"
                  }
                },
                "api_key": [{ "current_key": "PLACEHOLDER_API_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          PLACEHOLDER
            sed -i "s/__APP__/$APP/g" "apps/$APP/google-services.json"
            echo "⚠ No GH secret — wrote placeholder. Push notifications will not work in this build."
          fi

      - name: Expo prebuild (native android project)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://lqaufszburqvlslpcuac.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hSzDS_2ivar8CGqUm-yd3w_-65h1Zsc
          EXPO_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoidHJpY2lnbyIsImEiOiJjbW1wbmlnemIwczI4MnNvcmdremJwaTRzIn0._lAOaQ1Eg9LfszmlcZ5GQg
          EXPO_PUBLIC_SENTRY_DSN: https://c2c4fdaaa1b31143a8c7d20798005334@o4511046478659584.ingest.us.sentry.io/4511046494519296
          EXPO_PUBLIC_POSTHOG_API_KEY: phc_bgHqti7yz10ZStiwKwPeoYprkQeT7bu00QDV1hVvmv9
          EXPO_PUBLIC_DEMO_MODE: ${{ steps.target.outputs.demo }}
          EXPO_PUBLIC_DEMO_CITY: ${{ steps.target.outputs.demo_city }}
        run: |
          cd apps/${{ steps.target.outputs.app }}
          pnpm exec expo prebuild --platform android --no-install --clean

      - name: Bump Gradle JVM heap (prevent OOM on release builds)
        run: |
          cd apps/${{ steps.target.outputs.app }}/android
          # Override / add the jvmargs line in gradle.properties so the Gradle
          # daemon (spawned by ./gradlew) also uses 6GB heap, matching
          # GRADLE_OPTS on the CLI side.
          if grep -q "^org.gradle.jvmargs=" gradle.properties; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8|' gradle.properties
          else
            echo "" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          grep "^org.gradle.jvmargs" gradle.properties

      - name: APK size diet (arm64-only + ProGuard/R8 + resource shrink)
        run: |
          APP="${{ steps.target.outputs.app }}"
          cd "apps/$APP/android"
          # ── 1. Only ship arm64-v8a ────────────────────────────────
          # Drops x86/x86_64 (emulator-only) and armeabi-v7a (pre-2017
          # phones, <5% Cuba install base in 2026). Saves ~113MB per APK.
          sed -i 's|^reactNativeArchitectures=.*|reactNativeArchitectures=arm64-v8a|' gradle.properties
          # ── 2. Enable ProGuard/R8 minification + resource shrink ──
          # Requires proguard-rules.pro to have keep-rules for every
          # reflection-based lib (Mapbox, Stripe, Sentry, PostHog, Expo,
          # Supabase/OkHttp). Those rules live in apps/$APP/build-config/
          # and get copied below.
          # Strategy: strip any existing lines (commented or not) and
          # append fresh at end of file so there's no ambiguity.
          sed -i '/enableMinifyInReleaseBuilds/d' gradle.properties
          sed -i '/enableShrinkResourcesInReleaseBuilds/d' gradle.properties
          printf '\n# APK size diet (injected by CI)\nandroid.enableMinifyInReleaseBuilds=true\nandroid.enableShrinkResourcesInReleaseBuilds=true\n' >> gradle.properties
          echo "── Effective property values ──"
          grep -E "^(reactNativeArchitectures|android\.enableMinify|android\.enableShrink)" gradle.properties
          # ── 3. Install comprehensive ProGuard keep-rules ──────────
          cp "../build-config/proguard-rules.pro" "app/proguard-rules.pro"
          echo "✓ Installed custom proguard-rules.pro (size: $(wc -l < app/proguard-rules.pro) lines)"

      - name: Configure release to sign with debug keystore
        run: |
          cd apps/${{ steps.target.outputs.app }}/android/app
          # Expo prebuild generates android/app/debug.keystore. We reuse it for
          # release signing so CI produces a standalone sideload-able APK without
          # needing external secrets. This keystore is NOT valid for Play Store.
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=TriciGo,C=CU"
          fi
          # Patch build.gradle: point release signingConfig at debug keystore
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('build.gradle')
          src = p.read_text()
          # Replace the default release signingConfig block to use debug keystore
          new = re.sub(
              r"signingConfigs\s*\{[^}]*release\s*\{[^}]*\}",
              "",
              src,
              flags=re.DOTALL,
          )
          # Insert our signingConfig inside signingConfigs { ... }
          inject = '''
              release {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          '''
          new = re.sub(
              r"(signingConfigs\s*\{)",
              r"\1" + inject,
              new,
              count=1,
          )
          # Make buildType release use that signing config
          new = re.sub(
              r"(buildTypes\s*\{[^}]*release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              new,
              count=1,
              flags=re.DOTALL,
          )
          p.write_text(new)
          print(new[-2000:])
          PY

      - name: Build release APK (standalone, JS bundled)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://lqaufszburqvlslpcuac.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hSzDS_2ivar8CGqUm-yd3w_-65h1Zsc
          EXPO_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoidHJpY2lnbyIsImEiOiJjbW1wbmlnemIwczI4MnNvcmdremJwaTRzIn0._lAOaQ1Eg9LfszmlcZ5GQg
          EXPO_PUBLIC_SENTRY_DSN: https://c2c4fdaaa1b31143a8c7d20798005334@o4511046478659584.ingest.us.sentry.io/4511046494519296
          EXPO_PUBLIC_POSTHOG_API_KEY: phc_bgHqti7yz10ZStiwKwPeoYprkQeT7bu00QDV1hVvmv9
          EXPO_PUBLIC_DEMO_MODE: ${{ steps.target.outputs.demo }}
          EXPO_PUBLIC_DEMO_CITY: ${{ steps.target.outputs.demo_city }}
          SENTRY_ORG: agencia-senores
          SENTRY_PROJECT: tricigo-mobile
          NODE_OPTIONS: --max_old_space_size=4096
          # Gradle + JVM heap — client bundle (~12MB) OOMed CompileArtProfileTask
          # on the default 1.5GB heap. Runner has 16GB; give Gradle 6GB.
          GRADLE_OPTS: "-Xmx6g -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Xmx6g"
        run: |
          cd apps/${{ steps.target.outputs.app }}/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate + rename APK
        id: apk
        run: |
          cd apps/${{ steps.target.outputs.app }}/android/app/build/outputs/apk/release
          ls -la
          SRC=$(ls app-release.apk 2>/dev/null || ls app-release-unsigned.apk)
          # Sanitize ref_name so branches with slashes (e.g. claude/foo)
          # don't break `mv` by being parsed as a directory path.
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          DEST=tricigo-${{ steps.target.outputs.app }}-${SAFE_REF}.apk
          mv "$SRC" "$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tricigo-${{ steps.target.outputs.app }}-apk
          path: apps/${{ steps.target.outputs.app }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          echo "### ✅ Standalone APK built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- App: **${{ steps.target.outputs.app }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- File: ${{ steps.apk.outputs.dest }}" >> $GITHUB_STEP_SUMMARY
          echo "- Download: [Actions → this run → Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install on Android:** enable \"Install from unknown sources\", then open the APK file." >> $GITHUB_STEP_SUMMARY
          echo "JS is bundled — no Metro server needed." >> $GITHUB_STEP_SUMMARY
