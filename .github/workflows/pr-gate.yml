name: PR gate

# Reads the PR description and the diff (scripts/check-pr.mjs). Runs again when the description is
# edited. The rules are documented in CLAUDE.md, "PR gate", and docs/review/README.md.
#
# pull_request_target, not pull_request: GitHub then runs this file as it is on master, so a PR
# cannot rewrite the gate that judges it (with pull_request a PR could change this file to
# `exit 0`). That is safe here because no code of the PR runs: the PR head is checked out only to
# be read with git plumbing, the scripts that run come from master (git archive), no secret is
# used, and the token is read-only and not kept in the checkout. Keep it that way: never install,
# build or run anything from the PR head in this workflow.

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the PR head with full history (read as data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # No cache here: on pull_request_target a cache keyed on the PR's package files would be saved
      # in master's scope. setup-node v4 caches nothing unless asked; if it is ever bumped to a version
      # that caches by default, set `package-manager-cache: false`.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Take the gate from master
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          git archive origin/master scripts/check-pr.mjs scripts/lib docs/review/areas.json | tar -x -C "$RUNNER_TEMP/gate"

      # Every file of every open PR (the files endpoint pages up to 3000 per PR), so a large PR
      # still shows the migration numbers it holds.
      - name: List the files of the open PRs (migration numbers)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number' > "$RUNNER_TEMP/open-numbers.txt"
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const [numbersFile, out] = process.argv.slice(1);
            const repo = process.env.GITHUB_REPOSITORY;
            const numbers = fs.readFileSync(numbersFile, "utf8").split(/\s+/).filter(Boolean).map(Number);
            const prs = numbers.map((number) => ({
              number,
              files: execFileSync("gh", ["api", "--paginate", `repos/${repo}/pulls/${number}/files?per_page=100`, "--jq", ".[].filename"],
                { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 }).split("\n").filter(Boolean),
            }));
            fs.writeFileSync(out, JSON.stringify(prs));
            console.log(`open PRs read: ${prs.length}`);
          ' "$RUNNER_TEMP/open-numbers.txt" "$RUNNER_TEMP/open-prs.json"

      - name: Check the PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"
          node "$RUNNER_TEMP/gate/scripts/check-pr.mjs" --base origin/master --head "$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/body.md" --pr "$PR_NUMBER" --open-prs "$RUNNER_TEMP/open-prs.json"
