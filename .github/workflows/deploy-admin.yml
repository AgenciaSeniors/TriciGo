name: Deploy Admin

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy:
    name: Deploy Admin to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm turbo run build --filter=@tricigo/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: 'apps/admin/.next/standalone/,apps/admin/.next/static/,apps/admin/public/'
          target: '/tmp/tricigo-admin-deploy'

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            APP_DIR=/var/www/tricigo-admin
            DEPLOY_DIR=/tmp/tricigo-admin-deploy/apps/admin

            # Copy standalone build
            rsync -a --delete $DEPLOY_DIR/.next/standalone/ $APP_DIR/

            # Copy static assets (not included in standalone)
            mkdir -p $APP_DIR/.next/static
            cp -r $DEPLOY_DIR/.next/static/* $APP_DIR/.next/static/

            # Copy public folder
            cp -r $DEPLOY_DIR/public $APP_DIR/public 2>/dev/null || true

            # Find the server.js entry point (monorepo standalone nests it)
            cd $APP_DIR
            if [ -f server.js ]; then
              ENTRY=server.js
            elif [ -f apps/admin/server.js ]; then
              ENTRY=apps/admin/server.js
            else
              echo "server.js not found!" && ls -la $APP_DIR && ls -la $APP_DIR/apps/admin/ 2>/dev/null && exit 1
            fi

            # Restart with PM2 — use ecosystem.config.js for reliable env
            # passing.
            #
            # Port allocation on this VPS (per nginx + comments in
            # deploy-web.yml):
            #   3001  →  gst (unrelated 3rd-party app, 25d uptime)
            #   3002  →  tricigo-admin  (THIS workflow)
            #   3003  →  tricigo-web
            # nginx server_name admin.tricigo.com proxies to 127.0.0.1:3002.
            # Until 2026-04-25 this workflow was hardcoded to PORT=3000,
            # which collided with gst and produced silent EADDRINUSE in
            # pm2 logs while pm2 list still showed "online" — admin had
            # been 502 in prod for an undetermined window.
            ADMIN_PORT=3002
            pm2 delete tricigo-admin 2>/dev/null || true
            # Kill any process still holding our port
            fuser -k ${ADMIN_PORT}/tcp 2>/dev/null || true
            sleep 1

            # Write .env so server.js inherits PORT/HOSTNAME even outside PM2
            cat > $APP_DIR/.env << ENVEOF
            PORT=${ADMIN_PORT}
            HOSTNAME=0.0.0.0
            ENVEOF

            # Write ecosystem file with explicit env block
            cat > $APP_DIR/ecosystem.config.js << ECOEOF
            module.exports = {
              apps: [{
                name: 'tricigo-admin',
                script: '${ENTRY}',
                cwd: '${APP_DIR}',
                env: {
                  PORT: ${ADMIN_PORT},
                  HOSTNAME: '0.0.0.0',
                  NODE_ENV: 'production'
                }
              }]
            }
            ECOEOF

            pm2 start $APP_DIR/ecosystem.config.js
            pm2 save

            # Poll until Next.js binds the port. Cold start of the
            # standalone server.js can take 10-30s on this VPS, so a
            # fixed sleep is fragile. Try up to 12 × 5s = 60s.
            BOUND=0
            for i in $(seq 1 12); do
              if ss -tlnp | grep -q ":${ADMIN_PORT}.*LISTEN"; then
                BOUND=1
                echo "✓ tricigo-admin listening on :${ADMIN_PORT} (after ${i}×5s)"
                break
              fi
              sleep 5
            done
            if [ "$BOUND" != "1" ]; then
              echo "✗ tricigo-admin NOT listening on :${ADMIN_PORT} after 60s"
              pm2 logs tricigo-admin --lines 30 --nostream || true
              exit 1
            fi

            # Cleanup
            rm -rf /tmp/tricigo-admin-deploy
