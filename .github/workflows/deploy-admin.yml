name: Deploy Admin

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy:
    name: Deploy Admin to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm turbo run build --filter=@tricigo/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: 'apps/admin/.next/standalone/,apps/admin/.next/static/,apps/admin/public/'
          target: '/tmp/tricigo-admin-deploy'

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            APP_DIR=/var/www/tricigo-admin
            DEPLOY_DIR=/tmp/tricigo-admin-deploy/apps/admin

            # Copy standalone build
            rsync -a --delete $DEPLOY_DIR/.next/standalone/ $APP_DIR/

            # Copy static assets (not included in standalone)
            mkdir -p $APP_DIR/.next/static
            cp -r $DEPLOY_DIR/.next/static/* $APP_DIR/.next/static/

            # Copy public folder
            cp -r $DEPLOY_DIR/public $APP_DIR/public 2>/dev/null || true

            # Find the server.js entry point (monorepo standalone nests it)
            cd $APP_DIR
            if [ -f server.js ]; then
              ENTRY=server.js
            elif [ -f apps/admin/server.js ]; then
              ENTRY=apps/admin/server.js
            else
              echo "server.js not found!" && ls -la $APP_DIR && ls -la $APP_DIR/apps/admin/ 2>/dev/null && exit 1
            fi

            # Restart with PM2 — use ecosystem.config.js for reliable env
            # passing (the previous `PORT=... pm2 start` inline-env approach
            # silently dropped HOSTNAME under PM2 9, leading to admin
            # listening on 127.0.0.1 only and nginx getting 502 from
            # 0.0.0.0:3000 → connection refused).
            pm2 delete tricigo-admin 2>/dev/null || true
            # Kill any process still holding port 3000
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 1

            # Write .env so server.js inherits PORT/HOSTNAME even outside PM2
            cat > $APP_DIR/.env << ENVEOF
            PORT=3000
            HOSTNAME=0.0.0.0
            ENVEOF

            # Write ecosystem file with explicit env block
            cat > $APP_DIR/ecosystem.config.js << ECOEOF
            module.exports = {
              apps: [{
                name: 'tricigo-admin',
                script: '${ENTRY}',
                cwd: '${APP_DIR}',
                env: {
                  PORT: 3000,
                  HOSTNAME: '0.0.0.0',
                  NODE_ENV: 'production'
                }
              }]
            }
            ECOEOF

            pm2 start $APP_DIR/ecosystem.config.js
            pm2 save

            # Wait briefly + verify the process is actually listening
            sleep 5
            if ss -tlnp | grep -q ':3000.*LISTEN'; then
              echo "✓ tricigo-admin listening on :3000"
            else
              echo "✗ tricigo-admin NOT listening on :3000"
              pm2 logs tricigo-admin --lines 30 --nostream || true
              exit 1
            fi

            # Cleanup
            rm -rf /tmp/tricigo-admin-deploy
