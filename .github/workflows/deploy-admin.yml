name: Deploy Admin

# Same constraint as deploy-web: GitHub-hosted runners can't SSH to the VPS
# (Hostinger filters the Azure/GitHub IP ranges at its edge). Build on a
# GitHub-hosted runner, deploy with the SELF-HOSTED runner that lives on the
# VPS (outbound-only → immune to the inbound filtering). No appleboy SSH/SCP.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  build:
    name: Build admin (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm turbo run build --filter=@tricigo/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-build
          # LCA of these paths is apps/admin → artifact root holds
          # .next/standalone, .next/static and public.
          path: |
            apps/admin/.next/standalone
            apps/admin/.next/static
            apps/admin/public
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to VPS (self-hosted)
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: admin-build
          path: admin-build

      - name: Deploy locally + restart PM2
        run: |
          set -e
          APP_DIR=/var/www/tricigo-admin
          SRC="$(pwd)/admin-build"

          # Artifact root holds .next/standalone (LCA stripped); fall back to nested.
          if [ -d "$SRC/.next/standalone" ]; then
            BASE="$SRC"
          elif [ -d "$SRC/apps/admin/.next/standalone" ]; then
            BASE="$SRC/apps/admin"
          else
            echo "standalone build not found under $SRC"; find "$SRC" -maxdepth 4 -type d -name standalone; exit 1
          fi

          rsync -a --delete "$BASE/.next/standalone/" "$APP_DIR/"

          # Monorepo standalone nests server.js under apps/admin; static must
          # live next to it (was a prod blank-screen bug until 2026-04-25).
          cd "$APP_DIR"
          if [ -f server.js ]; then
            ENTRY=server.js; STATIC_DIR="$APP_DIR/.next/static"; PUBLIC_DIR="$APP_DIR/public"
          elif [ -f apps/admin/server.js ]; then
            ENTRY=apps/admin/server.js; STATIC_DIR="$APP_DIR/apps/admin/.next/static"; PUBLIC_DIR="$APP_DIR/apps/admin/public"
          else
            echo "server.js not found!"; ls -la "$APP_DIR"; ls -la "$APP_DIR/apps/admin" 2>/dev/null; exit 1
          fi

          mkdir -p "$STATIC_DIR"
          cp -r "$BASE/.next/static/." "$STATIC_DIR/"
          echo "Static copied to: $STATIC_DIR"; ls "$STATIC_DIR/" | head -5

          mkdir -p "$PUBLIC_DIR"
          rsync -a "$BASE/public/" "$PUBLIC_DIR/" 2>/dev/null || true

          # Port allocation on this VPS: 3001 gst, 3002 tricigo-admin, 3003 tricigo-web.
          # nginx server_name admin.tricigo.com → 127.0.0.1:3002.
          ADMIN_PORT=3002
          pm2 delete tricigo-admin 2>/dev/null || true
          fuser -k ${ADMIN_PORT}/tcp 2>/dev/null || true
          sleep 1

          cat > "$APP_DIR/.env" << ENVEOF
          PORT=${ADMIN_PORT}
          HOSTNAME=0.0.0.0
          ENVEOF

          cat > "$APP_DIR/ecosystem.config.js" << ECOEOF
          module.exports = {
            apps: [{
              name: 'tricigo-admin',
              script: '${ENTRY}',
              cwd: '${APP_DIR}',
              env: { PORT: ${ADMIN_PORT}, HOSTNAME: '0.0.0.0', NODE_ENV: 'production' }
            }]
          }
          ECOEOF

          pm2 start "$APP_DIR/ecosystem.config.js"
          pm2 save

          # Poll until Next binds the port (cold start can take 10-30s).
          BOUND=0
          for i in $(seq 1 12); do
            if ss -tlnp | grep -qE "[: .]${ADMIN_PORT}\b"; then
              BOUND=1; echo "✓ tricigo-admin listening on :${ADMIN_PORT} (after ${i}×5s)"; break
            fi
            sleep 5
          done
          if [ "$BOUND" != "1" ]; then
            echo "✗ tricigo-admin NOT listening on :${ADMIN_PORT} after 60s"
            pm2 logs tricigo-admin --lines 30 --nostream || true
            exit 1
          fi
