name: Sync POIs from open datasets

# Weekly sync of OSM + Overture + Foursquare into cuba_pois.
# See scripts/sync-pois/README.md for details.
#
# PR 5 of POI parity (2026-05-24): changed from monthly to weekly because:
#   - Overture and Foursquare update monthly upstream, so weekly captures
#     edits + bug fixes faster
#   - OSM long-tail (mypimes, paladares) deserves <30d freshness
#   - Complementary daily delta in sync-osm-delta.yml fills the OSM gap
#     between full syncs (24h freshness for OSM)

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC (~01:00 La Habana)
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Bounding box (w,s,e,n). Default: all Cuba.'
        required: false
        default: '-85.0,19.5,-74.0,23.5'
      dry_run:
        description: 'If "true", parse + dedup but skip Supabase writes'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      foursquare_release:
        description: 'Foursquare release date (YYYY-MM-DD or "latest")'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  sync:
    name: Download + merge + upsert POIs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/sync-pois/requirements.txt

      - name: Install osmium-tool (for OSM filtering)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Install Python deps
        run: |
          pip install -r scripts/sync-pois/requirements.txt

      - name: Resolve bbox
        id: cfg
        run: |
          BBOX="${{ github.event.inputs.bbox || '-85.0,19.5,-74.0,23.5' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          FSQ_RELEASE="${{ github.event.inputs.foursquare_release || 'latest' }}"
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "fsq_release=$FSQ_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Bbox: $BBOX  |  Dry run: $DRY_RUN  |  FSQ release: $FSQ_RELEASE"
          # El directorio se crea acá (paso que siempre corre) y no dentro del
          # primer download: si esa fuente cae, los pasos siguientes igual
          # necesitan /tmp/sync para escribir.
          mkdir -p /tmp/sync

      # ─────────── Step 1: Download Overture Places ───────────
      # 2026-08-22: una fuente caída NO puede volver a tumbar el sync entero.
      # Este paso venía fallando desde el 17/08 con
      #   Exception: Could not fetch STAC catalog: HTTP Error 404: Not Found
      # (el catálogo remoto de Overture al que apunta el CLI ya no resuelve;
      # `overturemaps>=0.13` en requirements.txt ya instala la última versión,
      # así que no es un pin viejo — es upstream). Al ser el paso 1 sin
      # continue-on-error, los 4 pasos siguientes quedaban `skipped` y NO se
      # hacía ningún upsert: los POIs llevaban 12 días sin refrescarse.
      # Ahora la caída degrada en vez de bloquear — el merge sigue con OSM +
      # Foursquare + Wikidata, y `load_overture` saltea el archivo ausente.
      - name: Download Overture Places (bbox-filtered)
        id: overture
        continue-on-error: true
        run: |
          set -o pipefail
          if overturemaps download \
               --bbox=${{ steps.cfg.outputs.bbox }} \
               -t place \
               -f geojson \
               -o /tmp/sync/overture.geojson; then
            ls -lah /tmp/sync/overture.geojson
            echo "Overture features: $(jq '.features | length' /tmp/sync/overture.geojson)"
          else
            # Borrar el parcial: un GeoJSON truncado haría reventar json.load()
            # en load_overture, que sí tolera el archivo AUSENTE.
            rm -f /tmp/sync/overture.geojson
            echo "::warning::Overture download failed (upstream STAC catalog). Sync continues with OSM + Foursquare + Wikidata; Overture rows just won't be refreshed this run."
            exit 1
          fi

      # ─────────── Step 2: Download Foursquare OS Places ───────────
      - name: Download Foursquare OS Places (bbox-filtered)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret not set — skipping Foursquare. To enable, add HF_TOKEN to GitHub repo secrets (free at huggingface.co/settings/tokens)."
            touch /tmp/sync/foursquare.parquet
          else
            python scripts/sync-pois/download_foursquare.py \
              --bbox=${{ steps.cfg.outputs.bbox }} \
              --out /tmp/sync/foursquare.parquet \
              --release ${{ steps.cfg.outputs.fsq_release }}
            ls -lah /tmp/sync/foursquare.parquet
          fi

      # ─────────── Step 3: Download OSM Cuba extract ───────────
      - name: Download OSM Cuba extract + filter POIs
        run: |
          curl -sSL --fail \
            https://download.geofabrik.de/central-america/cuba-latest.osm.pbf \
            -o /tmp/sync/cuba.osm.pbf
          ls -lah /tmp/sync/cuba.osm.pbf

          # osmium tags-filter only outputs OSM PBF/XML — it cannot emit
          # GeoJSON directly (it's not a format `osmium export` accepts as
          # input either way). Two-step: tags-filter narrows to POI tags,
          # then export converts the resulting .osm.pbf to GeoJSON.
          #
          # BUG-297: filter prefix is `nwr/` (nodes + ways + relations),
          # NOT `n/` (nodes only). A huge share of institutional POIs in
          # OSM — hospitals, schools, hotels, museums, stadiums, churches,
          # government buildings, large stores — are mapped as building
          # *ways*, not nodes. The old `n/` filter silently dropped them
          # all, roughly halving the OSM input. `osmium export` emits
          # Polygon/MultiPolygon geometry for ways/relations; the Python
          # merge step (load_osm → _representative_point) converts those
          # footprints to a point.
          osmium tags-filter /tmp/sync/cuba.osm.pbf \
            nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/historic nwr/healthcare nwr/public_transport \
            -o /tmp/sync/osm-pois-filtered.osm.pbf \
            --overwrite

          # `--add-unique-id=type_id` makes osmium write the OSM identity
          # into the GeoJSON feature's TOP-LEVEL `id` field (RFC 7946 §3.2)
          # as "n123" / "w456" / "r789" — NOT into properties. Without
          # this flag the identity is dropped and every sync re-inserts
          # the same rows; the Python script reads `feat["id"]` to match.
          osmium export /tmp/sync/osm-pois-filtered.osm.pbf \
            -f geojson \
            --add-unique-id=type_id \
            -o /tmp/sync/osm-pois.geojson \
            --overwrite

          ls -lah /tmp/sync/osm-pois.geojson
          echo "OSM features: $(jq '.features | length' /tmp/sync/osm-pois.geojson)"

      # ─────────── Step 3b: Download Wikidata POIs (SPARQL) ───────────
      # PR 6 of POI parity (2026-05-24): 4th source for notable landmarks
      # (Capitolio, Catedral, Plaza Revolución, museos, fortalezas). Bumps
      # importance=1 so these are always visible at any zoom level.
      - name: Download Wikidata POIs (SPARQL)
        run: |
          python scripts/sync-pois/download_wikidata.py \
            --out /tmp/sync/wikidata.geojson
          if [ -f /tmp/sync/wikidata.geojson ]; then
            echo "Wikidata features: $(jq '.features | length' /tmp/sync/wikidata.geojson)"
          fi
        continue-on-error: true  # SPARQL endpoint can be flaky; merge step handles missing file

      # ─────────── Step 4: Merge + dedup + upsert ───────────
      - name: Merge sources + upsert to Supabase
        id: upsert
        env:
          # Reuses NEXT_PUBLIC_SUPABASE_URL (already configured for Deploy Web/Admin)
          # rather than requiring a duplicate SUPABASE_URL secret. Same value.
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DRY_RUN: ${{ steps.cfg.outputs.dry_run == 'true' && '1' || '' }}
        run: |
          python scripts/sync-pois/merge_and_upsert.py \
            --osm /tmp/sync/osm-pois.geojson \
            --overture /tmp/sync/overture.geojson \
            --foursquare /tmp/sync/foursquare.parquet \
            --wikidata /tmp/sync/wikidata.geojson \
            --bbox=${{ steps.cfg.outputs.bbox }}

      # ─────────── Step 4b: Update poi_sync_state ───────────
      # After the full weekly sync, advance the sync-state pointer to the
      # current Geofabrik replication sequence so the daily delta workflow
      # (sync-osm-delta.yml) continues from here on subsequent days.
      # PR 5 of POI parity (2026-05-24).
      - name: Update poi_sync_state to current Geofabrik sequence
        if: steps.cfg.outputs.dry_run != 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          # Fetch latest Geofabrik replication sequence for Cuba
          SEQ=$(curl -sS https://download.geofabrik.de/central-america/cuba-updates/state.txt \
            | grep '^sequenceNumber=' | cut -d= -f2)
          if [ -z "$SEQ" ]; then
            echo "::warning::Could not fetch Geofabrik state.txt — skipping poi_sync_state update"
            exit 0
          fi
          echo "Setting poi_sync_state.cuba.last_sequence = $SEQ"
          curl -sS -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -H "Content-Type: application/json" \
            -d "{\"p_region\":\"cuba\",\"p_sequence\":$SEQ,\"p_kind\":\"full\",\"p_stats\":{\"inserted\":\"${{ steps.upsert.outputs.inserted || 0 }}\",\"updated\":\"${{ steps.upsert.outputs.updated || 0 }}\"}}" \
            "${SUPABASE_URL}/rest/v1/rpc/poi_sync_state_set" || echo "::warning::poi_sync_state_set RPC call failed"

      # ─────────── Step 5: Notify ───────────
      - name: Job summary
        if: always()
        run: |
          {
            echo "## POI sync ${{ job.status }}"
            echo ""
            if [ "${{ steps.overture.outcome }}" != "success" ]; then
              echo "> ⚠️ **Overture degradado** (\`${{ steps.overture.outcome }}\`): las filas de esa fuente no se refrescaron en esta corrida."
              echo ""
            fi
            echo "- **Bbox**: \`${{ steps.cfg.outputs.bbox }}\`"
            echo "- **Dry run**: ${{ steps.cfg.outputs.dry_run }}"
            echo "- **FSQ release**: ${{ steps.cfg.outputs.fsq_release }}"
            echo "- **Overture**: ${{ steps.overture.outcome }}"
            echo "- **Inserted**: ${{ steps.upsert.outputs.inserted || 'n/a' }}"
            echo "- **Updated**: ${{ steps.upsert.outputs.updated || 'n/a' }}"
            echo "- **Skipped (admin-locked)**: ${{ steps.upsert.outputs.skipped_admin || 'n/a' }}"
            echo "- **Total merged**: ${{ steps.upsert.outputs.total || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notify (success or failure)
        if: always() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OPS }}
        run: |
          STATUS_EMOJI=":white_check_mark:"
          if [ "${{ job.status }}" != "success" ]; then STATUS_EMOJI=":x:"; fi
          PAYLOAD=$(jq -nc \
            --arg t "$STATUS_EMOJI POI sync ${{ job.status }}" \
            --arg b "Inserted: ${{ steps.upsert.outputs.inserted || 'n/a' }} | Updated: ${{ steps.upsert.outputs.updated || 'n/a' }} | Total: ${{ steps.upsert.outputs.total || 'n/a' }}\nBbox: \`${{ steps.cfg.outputs.bbox }}\`" \
            '{text: $t, blocks: [{type:"section", text:{type:"mrkdwn", text:$b}}]}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
