name: Migration rehearsal

# Runs the rehearsal of every migration a PR adds or changes, on Postgres 17 + PostGIS as in
# production (supabase/tests/README.md). A plain image, not supabase/postgres: the rehearsals create
# the Supabase roles themselves and several check that postgres is not a superuser.
#
# This runs on pull_request because it has to execute the PR's own run.sh files. The planner and
# the runner script are taken from master, so a PR cannot loosen the rules it is judged by; the
# workflow file itself still comes from the PR, which the branch-protection step closes with a
# ruleset that requires this workflow from master (plan Task 27).

on:
  pull_request:
    branches: [master]

concurrency:
  group: migration-rehearsal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rehearsal:
    name: Migration rehearsal
    # Pinned: six older runners hard-code /usr/lib/postgresql/16/bin, the client of this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGPORT: '5433'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Planner and runner tests (this PR's copy)
        run: node --test scripts/ci/rehearsal-plan.test.mjs scripts/ci/rehearse-changed-migrations.test.mjs

      - name: Take the planner and the runner from master
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          if git cat-file -e origin/master:scripts/ci/rehearse-changed-migrations.mjs 2>/dev/null; then
            src=origin/master
          else
            src=HEAD
            echo "::warning::scripts/ci/rehearse-changed-migrations.mjs is not on master yet: this PR is judged by its own copy."
          fi
          git archive "$src" scripts/ci scripts/lib | tar -x -C "$RUNNER_TEMP/ci"

      - name: Postgres client
        run: |
          bin=""
          for dir in /usr/lib/postgresql/*/bin; do
            if [ -x "$dir/psql" ]; then bin="$dir"; fi
          done
          if [ -z "$bin" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            for dir in /usr/lib/postgresql/*/bin; do
              if [ -x "$dir/psql" ]; then bin="$dir"; fi
            done
          fi
          "$bin/psql" --version
          echo "PGBIN=$bin" >> "$GITHUB_ENV"

      - name: Postgres 17 with PostGIS (production is 17.6, collation en_US.UTF-8)
        run: |
          docker run -d --name pg -p 5433:5432 -e POSTGRES_USER=pgtest -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6 \
            -c max_connections=60 -c superuser_reserved_connections=3
          for _ in $(seq 1 90); do "$PGBIN/pg_isready" -q -h 127.0.0.1 -p 5433 -U pgtest && break; sleep 1; done
          "$PGBIN/psql" -h 127.0.0.1 -p 5433 -U pgtest -d postgres -Atc "select version(), datcollate from pg_database where datname = 'postgres'"

      - name: The template fails without its migration and passes with it
        run: |
          set +e
          out=$(bash supabase/tests/_template/run.sh none); code=$?
          echo "$out"
          if [ "$code" != 1 ] || ! echo "$out" | grep -q '^FAIL'; then echo "::error::the template's RED run did not fail as it must (exit $code)"; exit 1; fi
          bash supabase/tests/_template/run.sh supabase/tests/_template/example-migration.sql || { echo "::error::the template's GREEN run failed"; exit 1; }

      - name: Rehearse the migrations of this PR
        run: node "$RUNNER_TEMP/ci/scripts/ci/rehearse-changed-migrations.mjs" --base origin/master --head HEAD
