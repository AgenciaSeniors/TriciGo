name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The Edge Functions are Deno and live outside every tsconfig in the
      # monorepo, so `pnpm check-types` never saw them. Needed by
      # `pnpm check:ef-types` below.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Guardrail: every remote import in supabase/functions/** must be pinned to
      # an exact version. An unpinned @supabase/supabase-js@2 (esm.sh) bump broke
      # new-user login + address search on 2026-06-20 — this fails the PR if a
      # floating import (@2, @latest, jsr/npm without a full semver) lands again.
      - name: Check Edge Function imports are pinned
        run: pnpm check:ef-imports

      # Guardrail: `pnpm check-types` does NOT cover supabase/functions (Deno,
      # outside every tsconfig). PR #828 shipped an Edge Function that CALLED
      # getFreshFx without importing it — a guaranteed ReferenceError on the main
      # NETOPIA payment path — and it reached production with CI fully green,
      # because `node --check` only validates syntax. This gates on the small set
      # of type errors that always crash at runtime (TS2304/2305/2307/2552),
      # which measured ZERO on master, while merely reporting the 34 pre-existing
      # non-fatal ones so the check can go green on day one.
      - name: Type check Edge Functions (runtime-fatal only)
        run: pnpm check:ef-types

      - name: Type check
        run: pnpm check-types

      - name: Run tests
        run: pnpm test
        env:
          CI: true

      # ─────────────────────────────────────────────────────────────────────
      # DO NOT ADD A `supabase db push` STEP HERE. It would destroy production.
      #
      # There used to be one, gated on a SUPABASE_DB_PASSWORD secret that was
      # never set — so it always skipped, and printed a warning inviting an
      # operator to "add the secret to enable post-merge migrations". Setting
      # that secret would have detonated the following (verified 2026-07-16):
      #
      # Migrations here are applied via the Supabase MCP, which registers them
      # in `supabase_migrations.schema_migrations` by TIMESTAMP (e.g.
      # 20260716163835) — NOT by filename. `db push` matches by FILENAME
      # (00500_x.sql -> version "00500"). Only ~79 numeric versions are
      # registered, and they stop at 00109. So `db push` would consider ~389
      # already-applied migrations (00110..00500) as pending and re-run them
      # IN ORDER against production:
      #
      #   - 00223 re-defines `complete_ride_and_pay` -> clobbers the live 00340
      #     version (tricicoin/mixed-payment fix, weather surge, ...). This is
      #     the RPC that charges the rider and pays the driver.
      #   - 00153 re-defines `accept_ride_v2` -> clobbers the live 00377
      #     version (strict estimate/final pricing parity).
      #   - ...then it dies at 00235_wallet_v2_receipts.sql (CREATE TABLE with
      #     no IF NOT EXISTS, table already exists) and NEVER restores the newer
      #     definitions it just overwrote.
      #
      # Net effect: the money core silently reverts by months, mid-push.
      #
      # Migrations are applied deliberately, one at a time, via the Supabase
      # MCP (or `supabase db push` run by hand against a reconciled registry).
      # Before re-introducing any automated push, `schema_migrations` must first
      # be reconciled to filename versions — and that reconciliation must audit
      # each migration individually, because some in git were intentionally
      # never applied (see CLAUDE.md "MCP migration guard"); blanket-marking
      # them applied would skip them forever.
      # ─────────────────────────────────────────────────────────────────────
