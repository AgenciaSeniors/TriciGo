# Publish an OTA (JS-only) update via EAS Update.
#
# ALWAYS publish OTA updates through this workflow — never `eas update` from a
# local machine. Two reasons, both verified:
#
# 1. env inlining: `eas update` bundles JS locally and does NOT read the env
#    block in eas.json (that only applies to `eas build`). Without the
#    EXPO_PUBLIC_* vars below, the bundle inlines an EMPTY Supabase URL and
#    Mapbox token — and ships that to the whole fleet over the air.
#
# 2. fingerprint parity (driver): apps/driver uses runtimeVersion policy
#    "fingerprint", which content-hashes native-affecting files including the
#    local config plugins (plugins/with-*.js). A Windows checkout (CRLF)
#    produces a different hash than a Linux checkout (LF), so an update
#    published from Windows would target a runtime no CI/EAS-built binary has
#    and silently never arrive. Publishing from this Linux runner guarantees
#    the hash matches Linux-built binaries.
#
# Corollary of (2): driver STORE builds must also be produced from a Linux
# tree (eas-build.yml / GitHub Actions), not from a Windows machine.

name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to publish an OTA update for'
        type: choice
        options:
          - client
          - driver
        required: true
      message:
        description: 'Update message (shown in the EAS dashboard)'
        type: string
        required: true
      rollout_percentage:
        description: 'Fraction of the fleet reached immediately. Start small; widen with the "ops" workflow once it looks healthy.'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
          - '100'
        default: '10'
        required: true

concurrency:
  group: eas-update-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish OTA update (${{ inputs.app }})
    # OTA updates reach real users on next launch — only ever publish master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the bundle
        working-directory: apps/${{ inputs.app }}
        env:
          # Mirror of eas.json build.base.env + production profile.
          # `eas update` does NOT read eas.json env — these MUST be set here.
          EXPO_PUBLIC_SUPABASE_URL: https://lqaufszburqvlslpcuac.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hSzDS_2ivar8CGqUm-yd3w_-65h1Zsc
          EXPO_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoidHJpY2lnbyIsImEiOiJjbW1wbmlnemIwczI4MnNvcmdremJwaTRzIn0._lAOaQ1Eg9LfszmlcZ5GQg
          EXPO_PUBLIC_SENTRY_DSN: https://c2c4fdaaa1b31143a8c7d20798005334@o4511046478659584.ingest.us.sentry.io/4511046494519296
          EXPO_PUBLIC_POSTHOG_API_KEY: phc_bgHqti7yz10ZStiwKwPeoYprkQeT7bu00QDV1hVvmv9
          EXPO_PUBLIC_DEMO_MODE: 'false'
        run: |
          # --clear: never trust a warm Metro cache. Verified locally that a
          # warm cache reuses modules with a PREVIOUS run's env value already
          # inlined, which silently masks a missing variable.
          npx expo export --platform android --platform ios --output-dir dist --clear

      - name: Verify env inlining — gate before anything ships
        working-directory: apps/${{ inputs.app }}
        run: |
          # Assert every runtime-critical value actually landed in the bundle.
          # Checking only one is not enough: a typo in a single env key would
          # let the others pass and still ship a broken bundle.
          #
          # The Mapbox token is the most dangerous. Both apps do
          #   MapboxGL.setAccessToken(process.env.EXPO_PUBLIC_MAPBOX_TOKEN ?? '')
          # in app/_layout.tsx — that is JS, so an OTA can change it. An empty
          # token throws MapboxConfigurationException, and the driver's home
          # screen IS the map: the app would crash on launch, fleet-wide.
          #
          # grep -F works on the Hermes .hbc bytecode: string literals survive
          # in the string table. Verified against a real export.
          fail=0
          check() {
            if grep -rqF "$2" dist/_expo/static/js; then
              echo "  OK   $1"
            else
              echo "::error::$1 missing from the exported bundle — EXPO_PUBLIC_* env inlining failed. NOT publishing."
              fail=1
            fi
          }
          check "Supabase URL"  "lqaufszburqvlslpcuac.supabase.co"
          check "Mapbox token"  "pk.eyJ1IjoidHJpY2lnbyI"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Env inlining verified — safe to publish"

      - name: Publish the verified bundle to the production channel
        working-directory: apps/${{ inputs.app }}
        run: |
          # --input-dir + --skip-bundler publish EXACTLY the artifact verified
          # in the step above. Letting `eas update` re-bundle would mean
          # verifying one bundle and shipping a different one.
          #
          # --rollout-percentage: an OTA reaches devices on next launch with no
          # store review in between, so a bad bundle is a fleet-wide event with
          # no backstop. Users outside the rollout keep serving the previous
          # update on the branch — or, for the first OTA on a runtime, the
          # binary's embedded bundle. Either way they are unaffected.
          # Widen with .github/workflows/eas-update-ops.yml (promote), which
          # republishes THIS SAME group rather than building a new bundle.
          eas update \
            --channel production \
            --message "${{ inputs.message }}" \
            --rollout-percentage ${{ inputs.rollout_percentage }} \
            --input-dir dist \
            --skip-bundler \
            --non-interactive

      - name: What to do next
        run: |
          echo "Published to ${{ inputs.rollout_percentage }}% of the ${{ inputs.app }} fleet."
          echo ""
          echo "WATCH before widening: Sentry for a crash spike, and EAS"
          echo "  eas channel:insights production   (adoption / crashes / unique users)"
          echo ""
          echo "Then run 'EAS Update — ops' with:"
          echo "  promote  -> take this same update group to 100%"
          echo "  pause    -> stop the channel serving updates (fastest brake, no publish)"
          echo "  rollback -> republish the previous update, or the embedded bundle"
