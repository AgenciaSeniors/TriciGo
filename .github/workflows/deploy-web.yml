name: Deploy Web

# GitHub-hosted runners cannot reach the VPS over SSH (Hostinger filters the
# Azure/GitHub IP ranges at its network edge — the box firewall is open). So we
# build on a GitHub-hosted runner and deploy with a SELF-HOSTED runner that
# lives on the VPS: it polls GitHub outbound (no inbound SSH needed) and runs
# the deploy locally. To swap back to SSH later, restore the appleboy/* steps.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'

# One deploy at a time: two runs restarting PM2 together clobber each other.
concurrency:
  group: deploy-web-vps
  cancel-in-progress: false

jobs:
  build:
    name: Build web (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo run build --filter=@tricigo/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          # LCA of these three paths is apps/web → artifact root contains
          # .next/standalone, .next/static and public.
          path: |
            apps/web/.next/standalone
            apps/web/.next/static
            apps/web/public
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to VPS (self-hosted)
    needs: build
    # Only master deploys. The runner's job-started hook refuses anything else
    # anyway (ops/actions-runner/job-gate.sh); this keeps a dispatch from another
    # branch from reaching it at all.
    if: github.ref == 'refs/heads/master'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web-build

      - name: Deploy locally + restart PM2
        run: |
          set -e
          # At the end of a job the runner kills every process that carries its
          # RUNNER_TRACKING_ID, and PM2 hands this environment to the app it
          # starts: each deploy saw "Terminate orphan process: ... next-server"
          # and PM2 restarting the server a second after it came up.
          export RUNNER_TRACKING_ID=""
          APP_DIR=/var/www/tricigo-web
          SRC="$(pwd)/web-build"

          # The artifact root holds .next/standalone (LCA stripped). Fall back to
          # the nested layout just in case the LCA stripping differs.
          if [ -d "$SRC/.next/standalone" ]; then
            BASE="$SRC"
          elif [ -d "$SRC/apps/web/.next/standalone" ]; then
            BASE="$SRC/apps/web"
          else
            echo "standalone build not found under $SRC"; find "$SRC" -maxdepth 4 -type d -name standalone; exit 1
          fi

          # sharp (the image optimizer's native decoder) needs Node >= 20.9 since
          # 0.35. Load it with this server's node before touching the live dir:
          # if it cannot load, the deploy stops here and the running site stays.
          SHARP_PKG="$(find "$BASE/.next/standalone" -path '*/node_modules/sharp/package.json' -print -quit)"
          if [ -n "$SHARP_PKG" ]; then
            node -e 'const d = process.argv[1]; require(d); console.log("sharp", require(d + "/package.json").version, "loads on node", process.version)' "$(dirname "$SHARP_PKG")"
          else
            echo "sharp is not in the standalone build: every optimized image would fail"; exit 1
          fi

          # Sync the standalone server into the app dir.
          rsync -a --delete "$BASE/.next/standalone/" "$APP_DIR/"

          # The monorepo standalone output nests server.js under apps/web.
          cd "$APP_DIR"
          if [ -f server.js ]; then
            ENTRY=server.js; STATIC_DIR="$APP_DIR/.next/static"; PUBLIC_DIR="$APP_DIR/public"
          elif [ -f apps/web/server.js ]; then
            ENTRY=apps/web/server.js; STATIC_DIR="$APP_DIR/apps/web/.next/static"; PUBLIC_DIR="$APP_DIR/apps/web/public"
          else
            echo "server.js not found!"; ls -la "$APP_DIR"; ls -la "$APP_DIR/apps/web" 2>/dev/null; exit 1
          fi

          # Static assets to the path relative to server.js.
          mkdir -p "$STATIC_DIR"
          cp -r "$BASE/.next/static/." "$STATIC_DIR/"

          # public/ via rsync so dotfiles (.well-known/assetlinks.json) survive.
          mkdir -p "$PUBLIC_DIR"
          rsync -a "$BASE/public/" "$PUBLIC_DIR/"
          ls -la "$PUBLIC_DIR/.well-known/" 2>/dev/null || echo "WARN: $PUBLIC_DIR/.well-known/ missing"

          WEBPORT=3003
          pm2 stop tricigo-web 2>/dev/null || true
          pm2 delete tricigo-web 2>/dev/null || true
          fuser -k ${WEBPORT}/tcp 2>/dev/null || true
          sleep 1

          cat > "$APP_DIR/.env" << ENVEOF
          PORT=${WEBPORT}
          HOSTNAME=0.0.0.0
          ENVEOF

          cat > "$APP_DIR/ecosystem.config.js" << ECOEOF
          module.exports = {
            apps: [{
              name: 'tricigo-web',
              script: '${ENTRY}',
              cwd: '${APP_DIR}',
              env: { PORT: ${WEBPORT}, HOSTNAME: '0.0.0.0', NODE_ENV: 'production' }
            }]
          };
          ECOEOF

          cd "$APP_DIR"
          pm2 start ecosystem.config.js
          sleep 3
          pm2 save

          echo "=== Status ==="
          pm2 list
          ss -tlnp | grep ":${WEBPORT} " || echo "WARNING: nothing listening on ${WEBPORT}"
          echo "=== Smoke test ==="
          curl -sI http://localhost:${WEBPORT}/ 2>&1 | head -5 || echo "curl failed"
